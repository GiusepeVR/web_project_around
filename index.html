<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An image sharing site for explorers" />
    <meta name="keywords" content="Photography, Travel, Landscapes" />
    <meta name="author" content="Giusepe Velázquez" />
    <title>Around The U.S.</title>
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <nav class="nav">
          <img
            src="./images/logo.svg"
            alt="Around The U.S. Logo"
            class="nav__logo"
          />
        </nav>
        <h1 class="header__title">Around The U.S.</h1>
        <div class=""></div>
      </header>
      <main class="content">
        <section class="popup" id="delete-popup">
          <div class="popup__container">
            <button
              type="submit"
              class="popup__close-button"
              id="user-popup__close-button"
            ></button>
            <form name="edit" class="popup__form" id="delete-form">
              <fieldset class="popup__fieldset" id="profile-fieldset">
                <h4 class="popup__title">¿Estás seguro/a?</h4>

                <button type="submit" class="popup__button save-user">
                  Sí
                </button>
              </fieldset>
            </form>
          </div>
        </section>
        <section class="popup" id="user-popup">
          <div class="popup__container">
            <button
              type="submit"
              class="popup__close-button"
              id="user-popup__close-button"
            ></button>
            <form name="edit" class="popup__form" id="profile-form">
              <fieldset class="popup__fieldset" id="profile-fieldset">
                <h4 class="popup__title">Editar perfil</h4>
                <input
                  type="text"
                  name="name"
                  id="profile-name"
                  placeholder="Nombre"
                  class="popup__input popup__input_name"
                  value="Jacques Cousteau"
                  required
                  minlength="2"
                  maxlength="40"
                />
                <span class="popup__input-error profile-name-error"></span>
                <input
                  type="text"
                  name="about"
                  id="profile-about"
                  placeholder="Acerca de mí"
                  class="popup__input popup__input_about"
                  value="Explorador"
                  required
                  minlength="2"
                  maxlength="200"
                />
                <span class="popup__input-error profile-about-error"></span>
                <button type="submit" class="popup__button save-user">
                  Guardar
                </button>
              </fieldset>
            </form>
          </div>
        </section>
        <section class="popup" id="place-popup">
          <div class="popup__container">
            <button
              type="submit"
              class="popup__close-button"
              id="place-popup__close-button"
            ></button>
            <form name="edit" class="popup__form" id="place-form">
              <fieldset class="popup__fieldset" id="place-fieldset">
                <h4 class="popup__title">Nuevo lugar</h4>
                <input
                  type="text"
                  name="title"
                  id="place-name"
                  placeholder="Título"
                  class="popup__input popup__input_place"
                  required
                  minlength="2"
                  maxlength="30"
                />
                <span class="popup__input-error place-name-error"></span>
                <input
                  type="url"
                  name="link"
                  id="place-image-src"
                  placeholder="Enlace a la imagen"
                  class="popup__input popup__input_link"
                  required
                />
                <span class="popup__input-error place-image-src-error"></span>
                <button type="submit" class="popup__button save-place">
                  Guardar
                </button>
              </fieldset>
            </form>
          </div>
        </section>
        <section class="image-popup" id="image-overlay">
          <div class="image-popup__container">
            <button
              type="submit"
              class="image-popup__close-button"
              id="image-popup__close-button"
            ></button>
            <div class="image-popup__frame">
              <img src="" alt="Landscape overlay" class="image-popup__img" />
              <span class="image-popup__label"></span>
            </div>
          </div>
        </section>

        <section class="profile" id="profile">
          <div class="profile__content">
            <img
              src="./images/avatar.png"
              alt="Avatar image"
              class="profile__avatar"
            />
            <div class="profile__labels">
              <div class="profile__title">
                <h2 class="profile__name"></h2>
                <button class="profile__edit-button"></button>
              </div>
              <p class="profile__description"></p>
            </div>
          </div>
          <button class="profile__add-button"></button>
        </section>
        <section class="photo-grid"></section>
      </main>
      <footer class="footer" id="footer">
        <p class="footer__copyright">&copy; 2021 Around The U.S.</p>
      </footer>
    </div>
    <template id="card-template"
      ><div class="photo-grid__card">
        <button class="photo-grid__card-button_delete"></button>

        <img src="" alt="Landscape image" class="photo-grid__card-image" />
        <div class="photo-grid__card-bottom">
          <h3 class="photo-grid__card-title"></h3>
          <button class="photo-grid__card-button_like"></button>
        </div>
      </div>
    </template>
    <script type="module" src="scripts/script.js"></script>
  </body>
</html>
