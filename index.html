<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An image sharing site for explorers" />
    <meta name="keywords" content="Photography, Travel, Landscapes" />
    <meta name="author" content="Giusepe Velázquez" />
    <title>Around The U.S.</title>
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <nav class="nav">
          <img
            src="./images/logo.svg"
            alt="Around The U.S. Logo"
            class="nav__logo"
          />
        </nav>
        <h1 class="header__title">Around The U.S.</h1>
        <div class=""></div>
      </header>
      <main class="content">
        <template id="popup-template">
          <section class="popup">
            <div class="popup__container">
              <button
                type="submit"
                class="popup__close-button"
                id="popup__generic-close-button"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="58"
                  height="57"
                  fill="none"
                  class="popup__close-svg"
                >
                  <path
                    fill="#fff"
                    d="M41.57 12.57 29 25.143 16.43 12.57l-3.143 3.143 12.57 12.57-12.57 12.571 3.142 3.143L29 31.427l12.57 12.57 3.144-3.142-12.571-12.57 12.57-12.572-3.142-3.142Z"
                  />
                </svg>
              </button>
              <form name="edit" class="popup__form">
                <h4 class="popup__title">Title</h4>
                <input
                  type="text"
                  name="text-input"
                  id="#template-first-input"
                  placeholder="first"
                  class="popup__input popup__input_primary"
                />
                <input
                  type="text"
                  name="profile-about"
                  id="#template-second-input"
                  placeholder="second"
                  class="popup__input popup__input_secondary"
                />
                <button type="submit" class="popup__save-button">
                  Guardar
                </button>
              </form>
            </div>
          </section>
        </template>
        <section class="popup" id="user-popup">
          <div class="popup__container">
            <button type="submit" class="popup__close-button">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="58"
                height="57"
                fill="none"
                class="popup__close-svg"
              >
                <path
                  fill="#fff"
                  d="M41.57 12.57 29 25.143 16.43 12.57l-3.143 3.143 12.57 12.57-12.57 12.571 3.142 3.143L29 31.427l12.57 12.57 3.144-3.142-12.571-12.57 12.57-12.572-3.142-3.142Z"
                />
              </svg>
            </button>
            <form name="edit" class="popup__form">
              <h4 class="popup__title">Editar perfil</h4>
              <input
                type="text"
                name="profile-name"
                id="#profile-name"
                placeholder="Nombre"
                class="popup__input popup__input_name"
              />
              <input
                type="text"
                name="profile-about"
                id="#profile-about"
                placeholder="Acerca de mí"
                class="popup__input popup__input_about"
              />
              <button type="submit" class="popup__save-button save-user">
                Guardar
              </button>
            </form>
          </div>
        </section>
        <section class="popup" id="place-popup">
          <div class="popup__container">
            <button
              type="submit"
              class="popup__close-button"
              id="popup__close-button"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="58"
                height="57"
                fill="none"
                class="popup__close-svg"
              >
                <path
                  fill="#fff"
                  d="M41.57 12.57 29 25.143 16.43 12.57l-3.143 3.143 12.57 12.57-12.57 12.571 3.142 3.143L29 31.427l12.57 12.57 3.144-3.142-12.571-12.57 12.57-12.572-3.142-3.142Z"
                />
              </svg>
            </button>
            <form name="edit" class="popup__form">
              <h4 class="popup__title">Nuevo lugar</h4>
              <input
                type="text"
                name="place-name"
                id="#place-name"
                placeholder="Título"
                class="popup__input popup__input_place"
              />
              <input
                type="text"
                name="place-image-src"
                id="#place-image-src"
                placeholder="Enlace a la imagen"
                class="popup__input popup__input_link"
              />
              <button type="submit" class="popup__save-button save-place">
                Guardar
              </button>
            </form>
          </div>
        </section>
        <section class="image-popup" id="place-overlay">
          <div class="image-popup__container">
            <button
              type="submit"
              class="image-popup__close-button"
              id="image-popup__close-button"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="58"
                height="57"
                fill="none"
                class="popup__close-svg"
              >
                <path
                  fill="#fff"
                  d="M41.57 12.57 29 25.143 16.43 12.57l-3.143 3.143 12.57 12.57-12.57 12.571 3.142 3.143L29 31.427l12.57 12.57 3.144-3.142-12.571-12.57 12.57-12.572-3.142-3.142Z"
                />
              </svg>
            </button>
            <div class="image-popup__frame">
              <img
                src="https://practicum-content.s3.us-west-1.amazonaws.com/new-markets/WEB_sprint_5/ES/lago.jpg"
                alt="Landscape overlay"
                class="image-popup__img"
              />
            </div>
          </div>
        </section>
        <section class="profile" id="profile">
          <div class="profile__content">
            <img
              src="./images/avatar.png"
              alt="Avatar image"
              class="profile__avatar"
            />
            <div class="profile__labels">
              <div class="profile__title">
                <h2 class="profile__name">Jacques Cousteau</h2>
                <button class="profile__edit-button">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="8"
                    height="8"
                    fill="none"
                    class="profile__edit-svg"
                  >
                    <path
                      fill="#fff"
                      d="M7.5.996 1.953 6.575l-.99-1.01L6.494 0 7.5.996ZM0 7.5l1.472-.441-1.033-.996L0 7.5Z"
                    />
                  </svg>
                </button>
              </div>
              <p class="profile__description">Explorador</p>
            </div>
          </div>
          <button class="profile__add-button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="none"
            >
              <path
                fill="#fff"
                d="M16 7.111H8.889V0H7.11v7.111H0V8.89h7.111V16H8.89V8.889H16V7.11Z"
              />
            </svg>
          </button>
        </section>
        <section class="photo-grid"></section>
      </main>
      <footer class="footer" id="footer">
        <p class="footer__copyright">&copy; 2021 Around The U.S.</p>
      </footer>
    </div>
    <template id="card-template"
      ><div class="photo-grid__card">
        <button class="photo-grid__card-button_delete">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            fill="none"
          >
            <path
              fill="#fff"
              d="M4.458 19.142c.06.67.61 1.158 1.28 1.158H16.26c.67 0 1.22-.508 1.28-1.158L18.72 6.79H3.28l1.178 12.352ZM18.72 2.93h-5.14v-.65c0-.711-.569-1.28-1.28-1.28H9.72c-.711 0-1.28.569-1.28 1.28v.65H3.28C2.569 2.93 2 3.499 2 4.21c0 .711.569 1.28 1.28 1.28h15.44c.711 0 1.28-.569 1.28-1.28 0-.711-.569-1.28-1.28-1.28Z"
            />
          </svg>
        </button>

        <img src="" alt="Landscape image" class="photo-grid__card-image" />
        <div class="photo-grid__card-bottom">
          <h3 class="photo-grid__card-title"></h3>
          <button class="photo-grid__card-button_like"></button>
        </div>
      </div>
    </template>
    <script src="scripts/script.js"></script>
  </body>
</html>
